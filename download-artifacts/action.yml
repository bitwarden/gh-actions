---
name: "Download workflow artifact"
description: "Find a workflow run with find-workflow-run, then download its artifacts with actions/download-artifact."
author: "Bitwarden"
branding:
  icon: download
  color: blue

inputs:
  github_token:
    description: "Token with actions:read on the repository."
    default: ${{ github.token }}
  workflow:
    description: "Workflow file name or ID. If not set, inferred from run_id, or the current workflow."
    required: false
  workflow_conclusion:
    description: "Conclusion (e.g. success) or status (e.g. completed) the run must have. Empty matches any run."
    default: success
  repo:
    description: "Repository the workflow belongs to, in owner/repo format."
    default: ${{ github.repository }}
  pr:
    description: "Pull request number. Finds the newest matching run of the pull request's head commit."
    required: false
  commit:
    description: "Find the newest matching run built from this commit SHA."
    required: false
  branch:
    description: "Find the newest matching run on this branch."
    required: false
  event:
    description: "No longer supported. Fails the step if set."
    required: false
  run_id:
    description: "Use this run as is, without searching."
    required: false
  run_number:
    description: "No longer supported. Fails the step if set."
    required: false
  artifacts:
    description: "Artifacts to download. Comma-separated names with * wildcards. Downloads all artifacts if not set."
    required: false
  name_is_regexp:
    description: "With search_artifacts, treat artifacts as a single regular expression when searching for a run."
    default: "false"
  path:
    description: "Where to put the artifacts. Every artifact is extracted into it directly."
    default: "./"
  allow_forks:
    description: "Accept runs from forks of the repository."
    default: "false"
  require_branch_head:
    description: |
      Fail unless the selected run was built from the latest commit on `branch`.

      Use for releases, where silently falling back to an older build is not acceptable. Requires `branch`.
      Only runs of the branch itself count; pull request runs at the same commit are skipped (use `pr` for those).
    default: "false"
  check_artifacts:
    description: "Skip runs without any artifacts when searching."
    default: "false"
  search_artifacts:
    description: "Skip runs that lack the artifacts and keep looking at older ones. Needs artifacts."
    default: "false"
  skip_unpack:
    description: "Save each artifact as <path>/<name>.zip instead of extracting it."
    default: "false"
  dry_run:
    description: "Find the run and its artifacts without downloading them."
    required: false
  if_no_artifact_found:
    description: "What to do when the run has no matching artifacts, or a matching artifact has expired: fail, warn or ignore. Lookup errors (no matching run, require_branch_head mismatch, API or auth errors) always fail."
    default: fail

outputs:
  error_message:
    description: "Set when the run lookup fails. The reason is in the Find workflow run step's log."
    value: ${{ steps.match.outputs.error_message }}
  dry_run:
    description: "With dry_run, true if artifacts were found and false otherwise."
    value: ${{ steps.match.outputs.dry_run }}
  found_artifact:
    description: "True if artifacts were found and false otherwise."
    value: ${{ steps.match.outputs.found_artifact }}
  artifacts:
    description: "JSON array of the matching artifacts, as returned by the GitHub API."
    value: ${{ steps.match.outputs.artifacts }}
  run_id:
    description: "ID of the workflow run the artifacts come from. Pass it to later steps as `run_id` to pin them to the same run."
    value: ${{ steps.match.outputs.run_id }}
  artifact-build-commit:
    description: "The commit the artifacts were built from."
    value: ${{ steps.match.outputs.artifact-build-commit }}
  artifact-build-branch:
    description: "The branch the artifacts were built from."
    value: ${{ steps.match.outputs.artifact-build-branch }}

runs:
  using: "composite"
  steps:
    - name: Prepare run lookup
      id: prepare
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ inputs.repo }}
        WORKFLOW: ${{ inputs.workflow }}
        PR: ${{ inputs.pr }}
        COMMIT: ${{ inputs.commit }}
        BRANCH: ${{ inputs.branch }}
        EVENT: ${{ inputs.event }}
        RUN_ID: ${{ inputs.run_id }}
        RUN_NUMBER: ${{ inputs.run_number }}
        ARTIFACTS: ${{ inputs.artifacts }}
        NAME_IS_REGEXP: ${{ inputs.name_is_regexp }}
        REQUIRE_BRANCH_HEAD: ${{ inputs.require_branch_head }}
        CHECK_ARTIFACTS: ${{ inputs.check_artifacts }}
        SEARCH_ARTIFACTS: ${{ inputs.search_artifacts }}
      run: bash "$GITHUB_ACTION_PATH/prepare.sh"

    # A failed lookup is handled by the next step, which follows if_no_artifact_found.
    - name: Find workflow run
      id: find
      continue-on-error: true
      uses: bitwarden/gh-actions/find-workflow-run@main
      with:
        github_token: ${{ inputs.github_token }}
        repo: ${{ inputs.repo }}
        workflow: ${{ steps.prepare.outputs.workflow }}
        run_id: ${{ inputs.run_id }}
        commit: ${{ steps.prepare.outputs.commit }}
        branch: ${{ steps.prepare.outputs.branch }}
        require_branch_head: ${{ inputs.require_branch_head }}
        workflow_conclusion: ${{ inputs.workflow_conclusion }}
        pull_requests: ${{ steps.prepare.outputs.pull_requests }}
        artifacts: ${{ steps.prepare.outputs.find_artifacts }}
        name_is_regexp: ${{ steps.prepare.outputs.find_name_is_regexp }}
        search_artifacts: ${{ steps.prepare.outputs.find_search_artifacts }}
        allow_forks: ${{ inputs.allow_forks }}

    - name: Match artifacts
      id: match
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ inputs.repo }}
        FIND_OUTCOME: ${{ steps.find.outcome }}
        RUN_ID: ${{ steps.find.outputs.run_id }}
        ARTIFACTS: ${{ inputs.artifacts }}
        DRY_RUN: ${{ inputs.dry_run }}
        IF_NO_ARTIFACT_FOUND: ${{ inputs.if_no_artifact_found }}
      run: bash "$GITHUB_ACTION_PATH/match-artifacts.sh"

    - name: Download artifacts
      if: steps.match.outputs.download == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        github-token: ${{ inputs.github_token }}
        repository: ${{ inputs.repo }}
        run-id: ${{ steps.match.outputs.run_id }}
        artifact-ids: ${{ steps.match.outputs.artifact_ids }}
        path: ${{ inputs.path }}
        merge-multiple: true
        skip-decompress: ${{ inputs.skip_unpack }}
