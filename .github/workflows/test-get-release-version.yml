name: Test Get Release Version Action

on:
  pull_request:
    paths:
      - "get-release-version/**"
      - ".github/workflows/test-get-release-version.yml"
  push:
    branches:
      - "main"
  workflow_dispatch:
    inputs: {}

permissions:
  contents: read

jobs:
  test-get-release-version:
    name: Test Get Release Version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      ### Valid cases ###

      - name: Non-monorepo, trim=false
        id: non_monorepo_no_trim
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/server

      - name: Non-monorepo, trim=true
        id: non_monorepo_trim
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/server
          trim: "true"

      - name: Monorepo browser, trim=false
        id: monorepo_browser_no_trim
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/clients
          monorepo: "true"
          monorepo-project: browser

      - name: Monorepo browser, trim=true
        id: monorepo_browser_trim
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/clients
          trim: "true"
          monorepo: "true"
          monorepo-project: browser

      - name: Monorepo cli, trim=false
        id: monorepo_cli
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/clients
          monorepo: "true"
          monorepo-project: cli

      - name: Monorepo desktop, trim=false
        id: monorepo_desktop
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/clients
          monorepo: "true"
          monorepo-project: desktop

      - name: Monorepo web, trim=false
        id: monorepo_web_no_trim
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/clients
          monorepo: "true"
          monorepo-project: web

      - name: Monorepo web, trim=true
        id: monorepo_web_trim
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/clients
          trim: "true"
          monorepo: "true"
          monorepo-project: web

      # Projects outside the clients set. bitwarden/sdk-sm also has bws-cli-v* tags; today the
      # newest is older than every bws-v* release, so this would pass without the '-v' match.
      # It guards against a future bws-cli-v* release being resolved for 'bws'. The 'deskto'
      # no-match case below is what exercises the '-v' match today.
      - name: Monorepo sdk-sm bws, trim=false
        id: monorepo_sdk_sm_bws
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/sdk-sm
          monorepo: "true"
          monorepo-project: bws

      - name: Monorepo sdk-internal rust, trim=true
        id: monorepo_sdk_internal_rust_trim
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/sdk-internal
          trim: "true"
          monorepo: "true"
          monorepo-project: rust

      # Mobile repos tag both apps as v<version>-<app>, so the app is a suffix, not a prefix.
      - name: Tag-suffix android bwpm, trim=false
        id: tag_suffix_android_bwpm
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/android
          tag-suffix: bwpm

      - name: Tag-suffix android bwa, trim=true
        id: tag_suffix_android_bwa_trim
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/android
          trim: "true"
          tag-suffix: bwa

      - name: Tag-suffix ios bwpm, trim=false
        id: tag_suffix_ios_bwpm
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/ios
          tag-suffix: bwpm

      - name: Tag-suffix ios bwa, trim=false
        id: tag_suffix_ios_bwa
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/ios
          tag-suffix: bwa

      - name: Non-monorepo, prerelease=false
        id: non_monorepo_stable
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/server
          prerelease: "false"

      - name: Monorepo desktop, prerelease=false
        id: monorepo_desktop_stable
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/clients
          monorepo: "true"
          monorepo-project: desktop
          prerelease: "false"

      # bitwarden/passwordless-server has both stable and pre-releases, and its
      # newest release is a pre-release, so the two filters resolve to different tags.
      - name: Non-monorepo, prerelease=true
        id: non_monorepo_prerelease
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/passwordless-server
          prerelease: "true"

      - name: Non-monorepo, prerelease=false on a repo with pre-releases
        id: non_monorepo_stable_mixed
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/passwordless-server
          prerelease: "false"

      # Legacy mode: no filtering, newest release regardless of type. Previously covered
      # implicitly by every case that omits 'prerelease', until the default became "false".
      - name: Non-monorepo, prerelease='' (most recent regardless of type)
        id: non_monorepo_legacy
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/passwordless-server
          prerelease: ""

      - name: Non-monorepo, prerelease=true, trim=true
        id: non_monorepo_prerelease_trim
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/passwordless-server
          prerelease: "true"
          trim: "true"

      ### No match cases ###

      - name: Prerelease=true with no matching pre-release
        id: prerelease_no_match
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/server
          prerelease: "true"

      # Near-miss of 'desktop'. Matching on '<project>-v' keeps it from resolving desktop-v*.
      - name: Monorepo-project that is a prefix of a real project
        id: monorepo_project_prefix_no_match
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/clients
          monorepo: "true"
          monorepo-project: "deskto"

      - name: Monorepo-project with no releases
        id: monorepo_project_no_match
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/clients
          monorepo: "true"
          monorepo-project: mobile

      # The project is passed to jq as data, so a quote can't change the filter.
      - name: Monorepo-project containing jq syntax
        id: monorepo_project_jq_syntax
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/clients
          monorepo: "true"
          monorepo-project: 'web") or true or ("'

      # Near-miss of 'bwa'. Matching on '-<suffix>' keeps it from resolving *-bwa.
      - name: Tag-suffix that is a suffix of a real one
        id: tag_suffix_partial_no_match
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/android
          tag-suffix: wa

      # The suffix is passed to jq as data, so a quote can't change the filter.
      - name: Tag-suffix containing jq syntax
        id: tag_suffix_jq_syntax
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/android
          tag-suffix: 'bwpm") or true or ("'

      # Each filter alone matches desktop-v* or nothing; together they must both hold.
      - name: Monorepo-project and tag-suffix both applied
        id: monorepo_project_tag_suffix_no_match
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/clients
          monorepo: "true"
          monorepo-project: desktop
          tag-suffix: bwpm

      ### Invalid cases ###

      - name: Invalid trim value
        id: invalid_trim
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/server
          trim: "maybe"

      - name: Invalid prerelease value
        id: invalid_prerelease
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/server
          prerelease: "maybe"

      # Near-miss values: substrings of a valid option. These slipped past the old
      # substring-matching validator and silently changed behaviour.
      - name: Invalid prerelease value that is a substring of a valid one
        id: invalid_prerelease_substring
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/server
          prerelease: "tru"

      - name: Invalid trim value that is a substring of a valid one
        id: invalid_trim_substring
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/server
          trim: "tru"

      - name: Invalid monorepo value
        id: invalid_monorepo
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/server
          monorepo: "yes"

      - name: Monorepo=true without monorepo-project
        id: monorepo_no_project
        continue-on-error: true
        uses: ./get-release-version
        with:
          repository: bitwarden/clients
          monorepo: "true"

      ### Validate ###

      - name: Validate Outputs
        env:
          NON_MONOREPO_NO_TRIM_OUTCOME: ${{ steps.non_monorepo_no_trim.outcome }}
          NON_MONOREPO_NO_TRIM_VERSION: ${{ steps.non_monorepo_no_trim.outputs.version }}
          NON_MONOREPO_TRIM_OUTCOME: ${{ steps.non_monorepo_trim.outcome }}
          NON_MONOREPO_TRIM_VERSION: ${{ steps.non_monorepo_trim.outputs.version }}
          MONOREPO_BROWSER_NO_TRIM_OUTCOME: ${{ steps.monorepo_browser_no_trim.outcome }}
          MONOREPO_BROWSER_NO_TRIM_VERSION: ${{ steps.monorepo_browser_no_trim.outputs.version }}
          MONOREPO_BROWSER_TRIM_OUTCOME: ${{ steps.monorepo_browser_trim.outcome }}
          MONOREPO_BROWSER_TRIM_VERSION: ${{ steps.monorepo_browser_trim.outputs.version }}
          MONOREPO_CLI_OUTCOME: ${{ steps.monorepo_cli.outcome }}
          MONOREPO_CLI_VERSION: ${{ steps.monorepo_cli.outputs.version }}
          MONOREPO_DESKTOP_OUTCOME: ${{ steps.monorepo_desktop.outcome }}
          MONOREPO_DESKTOP_VERSION: ${{ steps.monorepo_desktop.outputs.version }}
          MONOREPO_WEB_NO_TRIM_OUTCOME: ${{ steps.monorepo_web_no_trim.outcome }}
          MONOREPO_WEB_NO_TRIM_VERSION: ${{ steps.monorepo_web_no_trim.outputs.version }}
          MONOREPO_WEB_TRIM_OUTCOME: ${{ steps.monorepo_web_trim.outcome }}
          MONOREPO_WEB_TRIM_VERSION: ${{ steps.monorepo_web_trim.outputs.version }}
          MONOREPO_SDK_SM_BWS_OUTCOME: ${{ steps.monorepo_sdk_sm_bws.outcome }}
          MONOREPO_SDK_SM_BWS_VERSION: ${{ steps.monorepo_sdk_sm_bws.outputs.version }}
          MONOREPO_SDK_INTERNAL_RUST_TRIM_OUTCOME: ${{ steps.monorepo_sdk_internal_rust_trim.outcome }}
          MONOREPO_SDK_INTERNAL_RUST_TRIM_VERSION: ${{ steps.monorepo_sdk_internal_rust_trim.outputs.version }}
          TAG_SUFFIX_ANDROID_BWPM_OUTCOME: ${{ steps.tag_suffix_android_bwpm.outcome }}
          TAG_SUFFIX_ANDROID_BWPM_VERSION: ${{ steps.tag_suffix_android_bwpm.outputs.version }}
          TAG_SUFFIX_ANDROID_BWA_TRIM_OUTCOME: ${{ steps.tag_suffix_android_bwa_trim.outcome }}
          TAG_SUFFIX_ANDROID_BWA_TRIM_VERSION: ${{ steps.tag_suffix_android_bwa_trim.outputs.version }}
          TAG_SUFFIX_IOS_BWPM_OUTCOME: ${{ steps.tag_suffix_ios_bwpm.outcome }}
          TAG_SUFFIX_IOS_BWPM_VERSION: ${{ steps.tag_suffix_ios_bwpm.outputs.version }}
          TAG_SUFFIX_IOS_BWA_OUTCOME: ${{ steps.tag_suffix_ios_bwa.outcome }}
          TAG_SUFFIX_IOS_BWA_VERSION: ${{ steps.tag_suffix_ios_bwa.outputs.version }}
          NON_MONOREPO_STABLE_OUTCOME: ${{ steps.non_monorepo_stable.outcome }}
          NON_MONOREPO_STABLE_VERSION: ${{ steps.non_monorepo_stable.outputs.version }}
          MONOREPO_DESKTOP_STABLE_OUTCOME: ${{ steps.monorepo_desktop_stable.outcome }}
          MONOREPO_DESKTOP_STABLE_VERSION: ${{ steps.monorepo_desktop_stable.outputs.version }}
          NON_MONOREPO_PRERELEASE_OUTCOME: ${{ steps.non_monorepo_prerelease.outcome }}
          NON_MONOREPO_PRERELEASE_VERSION: ${{ steps.non_monorepo_prerelease.outputs.version }}
          NON_MONOREPO_STABLE_MIXED_OUTCOME: ${{ steps.non_monorepo_stable_mixed.outcome }}
          NON_MONOREPO_STABLE_MIXED_VERSION: ${{ steps.non_monorepo_stable_mixed.outputs.version }}
          NON_MONOREPO_LEGACY_OUTCOME: ${{ steps.non_monorepo_legacy.outcome }}
          NON_MONOREPO_LEGACY_VERSION: ${{ steps.non_monorepo_legacy.outputs.version }}
          NON_MONOREPO_PRERELEASE_TRIM_OUTCOME: ${{ steps.non_monorepo_prerelease_trim.outcome }}
          NON_MONOREPO_PRERELEASE_TRIM_VERSION: ${{ steps.non_monorepo_prerelease_trim.outputs.version }}
          PRERELEASE_NO_MATCH_OUTCOME: ${{ steps.prerelease_no_match.outcome }}
          MONOREPO_PROJECT_PREFIX_NO_MATCH_OUTCOME: ${{ steps.monorepo_project_prefix_no_match.outcome }}
          MONOREPO_PROJECT_NO_MATCH_OUTCOME: ${{ steps.monorepo_project_no_match.outcome }}
          MONOREPO_PROJECT_JQ_SYNTAX_OUTCOME: ${{ steps.monorepo_project_jq_syntax.outcome }}
          TAG_SUFFIX_PARTIAL_NO_MATCH_OUTCOME: ${{ steps.tag_suffix_partial_no_match.outcome }}
          TAG_SUFFIX_JQ_SYNTAX_OUTCOME: ${{ steps.tag_suffix_jq_syntax.outcome }}
          MONOREPO_PROJECT_TAG_SUFFIX_NO_MATCH_OUTCOME: ${{ steps.monorepo_project_tag_suffix_no_match.outcome }}
          INVALID_TRIM_OUTCOME: ${{ steps.invalid_trim.outcome }}
          INVALID_PRERELEASE_OUTCOME: ${{ steps.invalid_prerelease.outcome }}
          INVALID_PRERELEASE_SUBSTRING_OUTCOME: ${{ steps.invalid_prerelease_substring.outcome }}
          INVALID_TRIM_SUBSTRING_OUTCOME: ${{ steps.invalid_trim_substring.outcome }}
          INVALID_MONOREPO_OUTCOME: ${{ steps.invalid_monorepo.outcome }}
          MONOREPO_NO_PROJECT_OUTCOME: ${{ steps.monorepo_no_project.outcome }}
        run: |
          test_failures=()

          function assert_success() {
            local name="$1"
            local outcome="$2"
            local version="$3"
            local pattern="$4"

            if [[ "$outcome" != "success" ]]; then
              echo "${name}: FAIL (expected success, got ${outcome})"
              test_failures+=("$name")
            elif [[ -z "$version" ]]; then
              echo "${name}: FAIL (version is empty)"
              test_failures+=("$name")
            elif [[ ! "$version" =~ $pattern ]]; then
              echo "${name}: FAIL (version '${version}' does not match pattern '${pattern}')"
              test_failures+=("$name")
            else
              echo "${name}: pass (version=${version})"
            fi
          }

          function assert_differs() {
            local name="$1"
            local first="$2"
            local second="$3"

            if [[ "$first" == "$second" ]]; then
              echo "${name}: FAIL (both filters resolved to '${first}')"
              test_failures+=("$name")
            else
              echo "${name}: pass (prerelease=${first}, stable=${second})"
            fi
          }

          function assert_failure() {
            local name="$1"
            local outcome="$2"

            if [[ "$outcome" != "failure" ]]; then
              echo "${name}: FAIL (expected failure, got ${outcome})"
              test_failures+=("$name")
            else
              echo "${name}: pass"
            fi
          }

          assert_success "Non-monorepo, trim=false"     "$NON_MONOREPO_NO_TRIM_OUTCOME"     "$NON_MONOREPO_NO_TRIM_VERSION"     '^v[0-9]+\.[0-9]+\.[0-9]+$'
          assert_success "Non-monorepo, trim=true"      "$NON_MONOREPO_TRIM_OUTCOME"        "$NON_MONOREPO_TRIM_VERSION"        '^[0-9]+\.[0-9]+\.[0-9]+$'
          assert_success "Monorepo browser, trim=false" "$MONOREPO_BROWSER_NO_TRIM_OUTCOME" "$MONOREPO_BROWSER_NO_TRIM_VERSION" '^browser-v[0-9]+\.[0-9]+\.[0-9]+$'
          assert_success "Monorepo browser, trim=true"  "$MONOREPO_BROWSER_TRIM_OUTCOME"    "$MONOREPO_BROWSER_TRIM_VERSION"    '^[0-9]+\.[0-9]+\.[0-9]+$'
          assert_success "Monorepo cli, trim=false"     "$MONOREPO_CLI_OUTCOME"             "$MONOREPO_CLI_VERSION"             '^cli-v[0-9]+\.[0-9]+\.[0-9]+$'
          assert_success "Monorepo desktop, trim=false" "$MONOREPO_DESKTOP_OUTCOME"         "$MONOREPO_DESKTOP_VERSION"         '^desktop-v[0-9]+\.[0-9]+\.[0-9]+$'
          assert_success "Monorepo web, trim=false"    "$MONOREPO_WEB_NO_TRIM_OUTCOME"     "$MONOREPO_WEB_NO_TRIM_VERSION"     '^web-v[0-9]+\.[0-9]+\.[0-9]+$'
          assert_success "Monorepo web, trim=true"     "$MONOREPO_WEB_TRIM_OUTCOME"        "$MONOREPO_WEB_TRIM_VERSION"        '^[0-9]+\.[0-9]+\.[0-9]+$'
          assert_success "Monorepo sdk-sm bws, trim=false"    "$MONOREPO_SDK_SM_BWS_OUTCOME"     "$MONOREPO_SDK_SM_BWS_VERSION"     '^bws-v[0-9]+\.[0-9]+\.[0-9]+$'
          assert_success "Monorepo sdk-internal rust, trim=true" "$MONOREPO_SDK_INTERNAL_RUST_TRIM_OUTCOME" "$MONOREPO_SDK_INTERNAL_RUST_TRIM_VERSION" '^[0-9]+\.[0-9]+\.[0-9]+$'
          assert_success "Tag-suffix android bwpm, trim=false" "$TAG_SUFFIX_ANDROID_BWPM_OUTCOME"     "$TAG_SUFFIX_ANDROID_BWPM_VERSION"     '^v[0-9]+\.[0-9]+\.[0-9]+-bwpm$'
          assert_success "Tag-suffix android bwa, trim=true"   "$TAG_SUFFIX_ANDROID_BWA_TRIM_OUTCOME" "$TAG_SUFFIX_ANDROID_BWA_TRIM_VERSION" '^[0-9]+\.[0-9]+\.[0-9]+-bwa$'
          assert_success "Tag-suffix ios bwpm, trim=false"     "$TAG_SUFFIX_IOS_BWPM_OUTCOME"         "$TAG_SUFFIX_IOS_BWPM_VERSION"         '^v[0-9]+\.[0-9]+\.[0-9]+-bwpm$'
          assert_success "Tag-suffix ios bwa, trim=false"      "$TAG_SUFFIX_IOS_BWA_OUTCOME"          "$TAG_SUFFIX_IOS_BWA_VERSION"          '^v[0-9]+\.[0-9]+\.[0-9]+-bwa$'
          assert_success "Non-monorepo, prerelease=false"     "$NON_MONOREPO_STABLE_OUTCOME"     "$NON_MONOREPO_STABLE_VERSION"     '^v[0-9]+\.[0-9]+\.[0-9]+$'
          assert_success "Monorepo desktop, prerelease=false" "$MONOREPO_DESKTOP_STABLE_OUTCOME" "$MONOREPO_DESKTOP_STABLE_VERSION" '^desktop-v[0-9]+\.[0-9]+\.[0-9]+$'
          # Pre-release tags may carry a suffix (e.g. 2025.10.0-beta.1), so this pattern allows one.
          assert_success "Non-monorepo, prerelease=true"      "$NON_MONOREPO_PRERELEASE_OUTCOME" "$NON_MONOREPO_PRERELEASE_VERSION" '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          assert_success "Non-monorepo, prerelease=''"        "$NON_MONOREPO_LEGACY_OUTCOME"     "$NON_MONOREPO_LEGACY_VERSION"     '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          assert_success "Non-monorepo, prerelease=true, trim=true" "$NON_MONOREPO_PRERELEASE_TRIM_OUTCOME" "$NON_MONOREPO_PRERELEASE_TRIM_VERSION" '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          assert_success "Non-monorepo, prerelease=false on a repo with pre-releases" "$NON_MONOREPO_STABLE_MIXED_OUTCOME" "$NON_MONOREPO_STABLE_MIXED_VERSION" '^[0-9]+\.[0-9]+\.[0-9]+$'

          assert_differs "prerelease=true and prerelease=false resolve differently" "$NON_MONOREPO_PRERELEASE_VERSION" "$NON_MONOREPO_STABLE_MIXED_VERSION"

          assert_failure "Prerelease=true with no matching pre-release" "$PRERELEASE_NO_MATCH_OUTCOME"
          assert_failure "Monorepo-project 'deskto' (prefix of desktop)" "$MONOREPO_PROJECT_PREFIX_NO_MATCH_OUTCOME"
          assert_failure "Monorepo-project with no releases"  "$MONOREPO_PROJECT_NO_MATCH_OUTCOME"
          assert_failure "Monorepo-project containing jq syntax" "$MONOREPO_PROJECT_JQ_SYNTAX_OUTCOME"

          assert_failure "Tag-suffix 'wa' (suffix of bwa)"   "$TAG_SUFFIX_PARTIAL_NO_MATCH_OUTCOME"
          assert_failure "Tag-suffix containing jq syntax"   "$TAG_SUFFIX_JQ_SYNTAX_OUTCOME"
          assert_failure "Monorepo-project and tag-suffix both applied" "$MONOREPO_PROJECT_TAG_SUFFIX_NO_MATCH_OUTCOME"

          assert_failure "Invalid trim value"                "$INVALID_TRIM_OUTCOME"
          assert_failure "Invalid prerelease value"          "$INVALID_PRERELEASE_OUTCOME"
          assert_failure "Invalid prerelease substring 'tru'" "$INVALID_PRERELEASE_SUBSTRING_OUTCOME"
          assert_failure "Invalid trim substring 'tru'"      "$INVALID_TRIM_SUBSTRING_OUTCOME"
          assert_failure "Invalid monorepo value"            "$INVALID_MONOREPO_OUTCOME"
          assert_failure "Monorepo=true without project"     "$MONOREPO_NO_PROJECT_OUTCOME"

          if [[ ${#test_failures[@]} -gt 0 ]]; then
            echo ""
            echo "Failed tests: ${test_failures[*]}"
            exit 1
          else
            echo ""
            echo "All tests passed!"
          fi
