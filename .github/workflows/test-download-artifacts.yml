name: Test Download Artifacts Action

on:
  workflow_dispatch:
    inputs: {}
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Upload Test Artifacts
    types:
      - completed
  pull_request:
    paths:
      - "download-artifacts/**"
      - ".github/workflows/test-download-artifacts.yml"

permissions:
  contents: read

jobs:
  download-latest:
    name: Download Latest
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: artifact
          path: artifact

      - name: Test
        run: |
          cat artifact/sha
          echo "$GITHUB_SHA"

  download-main:
    name: Download main
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: artifact
          path: artifact
          branch: main

      - name: Test
        run: |
          cat artifact/sha
          echo "$GITHUB_SHA"

  download-branch:
    name: Download current branch
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract branch name
        id: extract_branch
        run: |
          branch=${GITHUB_REF#refs/heads/}
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: artifact
          path: artifact
          branch: ${{ steps.extract_branch.outputs.branch }}

      - name: Test
        run: |
          cat artifact/sha
          echo "$GITHUB_SHA"

  download-pr:
    name: Download Pull Request
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      id-token: write
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Upload Test Artifacts starts on the same push, so wait for its run at this commit to finish before
      # downloading from it. Reads the unfiltered run list, because head_sha filtered queries can omit runs.
      - name: Wait for upload run
        env:
          GH_TOKEN: ${{ github.token }}
          _HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 1 60); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/upload-test-artifacts.yml/runs?per_page=50" \
              --jq "[.workflow_runs[] | select(.head_sha == \"$_HEAD_SHA\")] | max_by(.id) // empty | \"\(.status) \(.conclusion)\"")
            echo "Upload run at $_HEAD_SHA: ${run:-not started}"
            if [[ "$run" == completed* ]]; then
              [[ "$run" == "completed success" ]] && exit 0
              echo "Upload run did not succeed"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for the upload run"
          exit 1

      - name: Download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: artifact
          path: artifact
          pr: ${{github.event.pull_request.number}}

      - name: Test
        run: |
          cat artifact/sha
          echo "$GITHUB_SHA"

  download-all:
    name: Download All
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml

      - name: Test
        run: |
          ls -atlh
          cat sha
          cat sha1
          cat sha2

  download-multiple:
    name: Download Multiple
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: "artifact1,
            artifact2"

      - name: Test
        run: |
          ls -atlh
          cat sha1
          cat sha2

  download-wildcard:
    name: Download Wildcard
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: "*.txt"

      - name: Test
        run: |
          ls -atlh
          cat sha1
          cat sha2

  download-conclusion:
    name: Download Conclusion
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: artifact
          path: artifact
          workflow_conclusion: ""

      - name: Test
        run: |
          cat artifact/sha
          echo "$GITHUB_SHA"

  download-outputs:
    name: Download outputs should not be empty
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download
        id: download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml

      - name: Test artifact-build-commit
        env:
          _ARTIFACT_BUILD_COMMIT: ${{ steps.download.outputs.artifact-build-commit }}
        run: |
          ls -atlh
          echo "$_ARTIFACT_BUILD_COMMIT"
          if [[ -z "$_ARTIFACT_BUILD_COMMIT" ]]; then
              echo "artifact-build-commit is empty"
              exit 1
          fi

      - name: Test artifact-build-branch
        env:
          _ARTIFACT_BUILD_BRANCH: ${{ steps.download.outputs.artifact-build-branch }}
        run: |
          ls -atlh
          echo "$_ARTIFACT_BUILD_BRANCH"
          if [[ -z "$_ARTIFACT_BUILD_BRANCH" ]]; then
              echo "artifact-build-branch is empty"
              exit 1
          fi

  download-no-matching-artifacts:
    name: Download with no matching artifacts should not crash
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List (dry run)
        id: dry-run
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: does-not-exist
          dry_run: true

      - name: Download
        id: download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: does-not-exist
          if_no_artifact_found: warn

      - name: Test
        env:
          _DRY_RUN_FOUND: ${{ steps.dry-run.outputs.found_artifact }}
          _DOWNLOAD_FOUND: ${{ steps.download.outputs.found_artifact }}
        run: |
          if [[ "$_DRY_RUN_FOUND" != "false" || "$_DOWNLOAD_FOUND" != "false" ]]; then
            echo "Expected found_artifact=false for both steps (dry run: '$_DRY_RUN_FOUND', download: '$_DOWNLOAD_FOUND')"
            exit 1
          fi

  download-branch-head:
    name: Download main with require_branch_head
    runs-on: ubuntu-22.04
    # The triggering upload run is the build of main HEAD, so the guard should pass, unless main has moved since.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check main has not moved
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          _TRIGGERING_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$head" == "$_TRIGGERING_COMMIT" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved to $head after the triggering upload run; skipping the HEAD check"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download
        id: download
        if: steps.head.outputs.current == 'true'
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: artifact
          path: artifact
          branch: main
          require_branch_head: true

      - name: Test
        if: steps.head.outputs.current == 'true'
        env:
          _ARTIFACT_BUILD_COMMIT: ${{ steps.download.outputs.artifact-build-commit }}
          _TRIGGERING_COMMIT: ${{ github.event.workflow_run.head_sha }}
          _RUN_ID: ${{ steps.download.outputs.run_id }}
          _TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [[ "$_ARTIFACT_BUILD_COMMIT" != "$_TRIGGERING_COMMIT" ]]; then
            echo "Expected the build of $_TRIGGERING_COMMIT, got $_ARTIFACT_BUILD_COMMIT"
            exit 1
          fi
          if [[ "$_RUN_ID" != "$_TRIGGERING_RUN_ID" ]]; then
            echo "Expected run_id $_TRIGGERING_RUN_ID, got $_RUN_ID"
            exit 1
          fi

  require-branch-head-without-branch:
    name: Download with require_branch_head but no branch should fail
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download
        id: download
        continue-on-error: true
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: artifact
          require_branch_head: true

      - name: Test
        env:
          _OUTCOME: ${{ steps.download.outcome }}
        run: |
          if [[ "$_OUTCOME" != "failure" ]]; then
            echo "Expected the step to fail, got $_OUTCOME"
            exit 1
          fi
