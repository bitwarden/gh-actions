---
name: "Get GitHub Latest Release Version"
description: "Retrieves the latest release tag from a GitHub repository."
inputs:
  repository:
    description: "This is the repository that we get the latest release version from"
    required: true
  trim:
    description: "Strips any tag prefix before the version number and any 'tag-suffix', keeping any pre-release suffix, e.g. 'desktop-v2026.10.0-beta.1' -> '2026.10.0-beta.1', 'v2026.10.0-bwpm' -> '2026.10.0': ('true', 'false')"
    required: false
    default: "false"
  monorepo:
    description: "Identifies if the github repo is a monorepo: ('true', 'false')"
    required: false
    default: "false"
  monorepo-project:
    description: "Tag prefix of the monorepo project, matched as '<monorepo-project>-v*', e.g. 'desktop' -> 'desktop-v2026.10.0', 'rust' -> 'rust-v1.0.0'"
    required: false
    default: ""
  tag-suffix:
    description: "Tag suffix after the version, matched as '*-<tag-suffix>', e.g. 'bwpm' -> 'v2026.10.0-bwpm'. Independent of 'monorepo'; when both are set, a tag must match both. 'trim' drops the suffix."
    required: false
    default: ""
  prerelease:
    description: "Filter by release type: 'false' (default) = latest stable release, 'true' = latest pre-release, '' = most recent regardless of type. 'true'/'false' exclude drafts."
    required: false
    default: "false"
outputs:
  version:
    description: "GitHub Latest Release version from specified repository"
    value: ${{ steps.get-release.outputs.version }}
runs:
  using: "composite"
  steps:
    - name: Input validation
      id: validation
      shell: bash
      env:
        INPUT_TRIM: ${{ inputs.trim }}
        INPUT_MONOREPO: ${{ inputs.monorepo }}
        INPUT_MONOREPO_PROJECT: ${{ inputs.monorepo-project }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
      run: |
        case "${INPUT_TRIM}" in
          "true" | "false") ;;
          *)
            echo "[!] 'trim' option only supports the following values: ('true', 'false')"
            exit 1
            ;;
        esac
        case "${INPUT_PRERELEASE}" in
          "" | "true" | "false") ;;
          *)
            echo "[!] 'prerelease' option only supports the following values: ('', 'true', 'false')"
            exit 1
            ;;
        esac
        case "${INPUT_MONOREPO}" in
          "true" | "false") ;;
          *)
            echo "[!] 'monorepo' option only supports the following values: ('true', 'false')"
            exit 1
            ;;
        esac
        if [ "${INPUT_MONOREPO}" == "true" ] && [ "${INPUT_MONOREPO_PROJECT}" == "" ]; then
          echo "[!] using the 'monorepo' option requires the use of 'monorepo-project'"
          exit 1
        fi

    - name: Check Runner OS
      shell: bash
      env:
        RUNNER_OS: ${{ runner.os }}
      run: |
        if [ "$RUNNER_OS" != "Linux" ]; then
          echo "[!] This workflow only supports Linux runners"
          exit 1
        fi

    - name: Get Latest Release Version
      id: get-release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ inputs.repository }}
        INPUT_TRIM: ${{ inputs.trim }}
        INPUT_MONOREPO: ${{ inputs.monorepo }}
        INPUT_MONOREPO_PROJECT: ${{ inputs.monorepo-project }}
        INPUT_TAG_SUFFIX: ${{ inputs.tag-suffix }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
      run: |
        # Optional release-type filter
        case "${INPUT_PRERELEASE}" in
            "true")  SELECT='select(.isPrerelease and (.isDraft | not))' ;;
            "false") SELECT='select((.isPrerelease | not) and (.isDraft | not))' ;;
            *)       SELECT='.' ;;
          esac

        # Optional tag filters. An empty prefix or suffix matches every tag.
        # Match '<project>-v' so a near-miss project ('deskto') or a shared prefix
        # ('bws' vs 'bws-cli') can't resolve another project's tag, and '-<suffix>'
        # so a near-miss suffix ('wa') can't resolve 'bwa'.
        PREFIX=""
        if [[ "${INPUT_MONOREPO}" == "true" ]]; then
          PREFIX="${INPUT_MONOREPO_PROJECT}-v"
        fi
        SUFFIX=""
        if [[ -n "${INPUT_TAG_SUFFIX}" ]]; then
          SUFFIX="-${INPUT_TAG_SUFFIX}"
        fi

        # List each matching tag as '<sort key><TAB><tag>', e.g.
        # 'desktop-v2026.10.0-beta.2' -> '2026.10.0~beta.2'. The key drops the prefix,
        # suffix and any leading 'v', so 'v2026.8.0' and '2026.9.0' compare as versions.
        # The prefix and suffix are passed with --arg so they are never parsed as part
        # of the jq program.
        RELEASES=$(
          gh release list --repo "$REPOSITORY" --limit 100 --order desc \
            --json tagName,isPrerelease,isDraft \
            | jq -r --arg prefix "$PREFIX" --arg suffix "$SUFFIX" \
              ".[] | $SELECT | .tagName
                   | select(startswith(\$prefix) and endswith(\$suffix))
                   | (ltrimstr(\$prefix) | rtrimstr(\$suffix) | ltrimstr(\"v\") | sub(\"-\"; \"~\")) + \"\t\" + ."
        )

        # Pick the highest version rather than the first in API order, which follows
        # the tagged commit's date, not the version. sort -V ranks '2026.10.0-beta.1'
        # above '2026.10.0'; the '~' in the key sorts before everything, which ranks a
        # stable release above its own pre-releases. -s keeps API order for equal keys.
        LATEST_RELEASE_TAG_VERSION=$(
          sort -t $'\t' -k 1,1Vr -s <<< "$RELEASES" | cut -f 2 | sed -n 1p
        )

        if [[ -z "$LATEST_RELEASE_TAG_VERSION" ]]; then
          echo "[!] No release found for '$REPOSITORY' matching prerelease='${INPUT_PRERELEASE}' monorepo-project='${INPUT_MONOREPO_PROJECT}' tag-suffix='${INPUT_TAG_SUFFIX}'"
          exit 1
        fi

        # The tag suffix names the app rather than the version, so 'trim' drops it like the prefix.
        if [[ "${INPUT_TRIM}" == "true" ]]; then
          LATEST_RELEASE_TAG_VERSION="${LATEST_RELEASE_TAG_VERSION%"$SUFFIX"}"
        fi

        case "${INPUT_TRIM}" in
            "true")
              # Strip everything before the first digit (project prefix and leading 'v'),
              # leaving any pre-release suffix intact (desktop-v2025.10.0-beta.1 -> 2025.10.0-beta.1).
              LATEST_RELEASE_TAG_VERSION="${LATEST_RELEASE_TAG_VERSION#"${LATEST_RELEASE_TAG_VERSION%%[0-9]*}"}"
              echo "version=$LATEST_RELEASE_TAG_VERSION" >> $GITHUB_OUTPUT
              ;;
            "false")
              echo "version=$LATEST_RELEASE_TAG_VERSION" >> $GITHUB_OUTPUT
              ;;
          esac
