name: "Validate AI"
description: "Reviews Claude Code material (.claude config, skills, agents, commands, hooks, CLAUDE.md, and plugins) using bundled structure checks and Claude Code with Bitwarden plugins"
inputs:
  azure_subscription_id:
    description: "Azure Subscription ID for OIDC authentication"
    required: true
  azure_tenant_id:
    description: "Azure Tenant ID for OIDC authentication"
    required: true
  azure_client_id:
    description: "Azure Client ID for OIDC authentication"
    required: true
  pr_number:
    description: "Pull request number to validate"
    required: true
  repository:
    description: "Repository in owner/repo format"
    required: true
  checkout_ref:
    description: "Git ref to check out (typically the PR head SHA)"
    required: true
  base_ref:
    description: "Base branch to diff against for change detection (typically the PR base ref)"
    required: true
  github_token:
    description: "GitHub token for API access"
    required: true

runs:
  using: "composite"
  steps:
    - name: Check out repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
        ref: ${{ inputs.checkout_ref }}
        persist-credentials: true

    - name: Detect changed Claude files
      id: changed-files
      shell: bash
      env:
        BASE_REF: ${{ inputs.base_ref }}
      run: |
        git fetch origin "$BASE_REF"
        CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF...HEAD")

        # Plugin dirs, plugin/marketplace manifests, .claude config, CLAUDE.md, validation scripts.
        RELEVANT=$(echo "$CHANGED_FILES" | grep -E '(^plugins/|(^|/)\.claude-plugin/|(^|/)\.claude/|(^|/)CLAUDE\.md$|(^|/)agents/.*\.md$|(^|/)skills/.*/SKILL\.md$|(^|/)commands/.*\.md$|(^|/)hooks\.json$|^scripts/validate-)' || echo "")

        if [[ -z "$RELEVANT" ]]; then
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "has_components=false" >> "$GITHUB_OUTPUT"
          echo "changed_plugins=" >> "$GITHUB_OUTPUT"
          echo "No Claude-related files changed — skipping validation."
          exit 0
        fi
        echo "should_run=true" >> "$GITHUB_OUTPUT"
        echo "Relevant Claude files changed:"
        echo "$RELEVANT"

        # Unique plugin directories (marketplace repos keep plugins under plugins/<name>/).
        CHANGED_PLUGINS=$(echo "$CHANGED_FILES" | grep '^plugins/' | cut -d/ -f1-2 | sort -u | tr '\n' ' ' | sed 's/ $//' || echo "")

        # Agents appear as agents/<name>/AGENT.md or agents/<name>.md, so match any .md under agents/.
        AGENT_FILES=$(echo "$RELEVANT" | grep -E '(^|/)agents/.*\.md$' || echo "")
        SKILL_FILES=$(echo "$RELEVANT" | grep -E '(^|/)skills/.*/SKILL\.md$' || echo "")
        COMMAND_FILES=$(echo "$RELEVANT" | grep -E '(^|/)commands/.*\.md$' || echo "")
        HOOK_FILES=$(echo "$RELEVANT" | grep -E '(^|/)hooks\.json$' || echo "")
        CONFIG_FILES=$(echo "$RELEVANT" | grep -E '(^|/)CLAUDE\.md$|(^|/)\.claude/' || echo "")

        # Version bumps are enforced only where a component changed, so a docs-only
        # edit under plugins/<name> does not require one.
        COMPONENT_PLUGINS=$(printf '%s\n' "$AGENT_FILES" "$SKILL_FILES" "$COMMAND_FILES" "$HOOK_FILES" | grep '^plugins/' | cut -d/ -f1-2 | sort -u | tr '\n' ' ' | sed 's/ $//' || echo "")

        # Gates marketplace validation on its own so a manifest-only edit still runs it.
        # Must stay single-line: a multi-line value breaks the key=value write below.
        if echo "$RELEVANT" | grep -qE '^\.claude-plugin/'; then
          MARKETPLACE_CHANGED=true
        else
          MARKETPLACE_CHANGED=""
        fi

        {
          echo "changed_files<<EOF"
          echo "$RELEVANT"
          echo "EOF"
          echo "changed_plugins=$CHANGED_PLUGINS"
          echo "agent_files<<EOF"
          echo "$AGENT_FILES"
          echo "EOF"
          echo "skill_files<<EOF"
          echo "$SKILL_FILES"
          echo "EOF"
          echo "command_files<<EOF"
          echo "$COMMAND_FILES"
          echo "EOF"
          echo "hook_files<<EOF"
          echo "$HOOK_FILES"
          echo "EOF"
          echo "config_files<<EOF"
          echo "$CONFIG_FILES"
          echo "EOF"
          echo "component_plugins=$COMPONENT_PLUGINS"
          echo "marketplace_changed=$MARKETPLACE_CHANGED"
        } >> "$GITHUB_OUTPUT"

        if [[ -n "$AGENT_FILES" ]] || [[ -n "$SKILL_FILES" ]] || [[ -n "$COMMAND_FILES" ]] || [[ -n "$HOOK_FILES" ]] || [[ -n "$CONFIG_FILES" ]]; then
          echo "has_components=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_components=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Validate plugin structure
      id: structure
      if: steps.changed-files.outputs.changed_plugins != '' && hashFiles('.claude-plugin/marketplace.json') != ''
      continue-on-error: true
      shell: bash
      env:
        CHANGED_PLUGINS: ${{ steps.changed-files.outputs.changed_plugins }}
        REPO_ROOT: ${{ github.workspace }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -o pipefail
        echo "Validating changed plugins: $CHANGED_PLUGINS"
        read -ra PLUGINS_ARRAY <<< "$CHANGED_PLUGINS"
        bash "$ACTION_PATH/scripts/validate-plugin-structure.sh" "${PLUGINS_ARRAY[@]}" 2>&1 | tee /tmp/structure-validation.log

    - name: Validate marketplace.json
      id: marketplace
      if: (steps.changed-files.outputs.changed_plugins != '' || steps.changed-files.outputs.marketplace_changed != '') && hashFiles('.claude-plugin/marketplace.json') != ''
      continue-on-error: true
      shell: bash
      env:
        CHANGED_PLUGINS: ${{ steps.changed-files.outputs.changed_plugins }}
        REPO_ROOT: ${{ github.workspace }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -o pipefail
        read -ra PLUGINS_ARRAY <<< "$CHANGED_PLUGINS"
        if [[ "${#PLUGINS_ARRAY[@]}" -gt 0 ]]; then
          echo "Validating marketplace entries for changed plugins: $CHANGED_PLUGINS"
        else
          echo "Marketplace manifest changed with no plugin directory change; running a full marketplace scan"
        fi
        bash "$ACTION_PATH/scripts/validate-marketplace.sh" "${PLUGINS_ARRAY[@]}" 2>&1 | tee /tmp/marketplace-validation.log

    - name: Validate version bump
      id: version-bump
      if: steps.changed-files.outputs.component_plugins != '' && hashFiles('.claude-plugin/marketplace.json') != ''
      continue-on-error: true
      shell: bash
      env:
        BASE_REF: ${{ inputs.base_ref }}
        COMPONENT_PLUGINS: ${{ steps.changed-files.outputs.component_plugins }}
        REPO_ROOT: ${{ github.workspace }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -o pipefail
        git fetch origin "$BASE_REF"
        echo "Checking version bumps for plugins with component changes: $COMPONENT_PLUGINS"
        read -ra PLUGINS_ARRAY <<< "$COMPONENT_PLUGINS"
        bash "$ACTION_PATH/scripts/validate-version-bump.sh" "origin/$BASE_REF" "${PLUGINS_ARRAY[@]}" 2>&1 | tee /tmp/version-bump-validation.log

    - name: Log in to Azure
      if: steps.changed-files.outputs.has_components == 'true'
      uses: bitwarden/gh-actions/azure-login@main
      with:
        subscription_id: ${{ inputs.azure_subscription_id }}
        tenant_id: ${{ inputs.azure_tenant_id }}
        client_id: ${{ inputs.azure_client_id }}

    - name: Get Azure Key Vault secrets
      id: get-kv-secrets
      if: steps.changed-files.outputs.has_components == 'true'
      uses: bitwarden/gh-actions/get-keyvault-secrets@main
      with:
        keyvault: gh-org-bitwarden
        secrets: "ANTHROPIC-CODE-REVIEW-API-KEY"

    - name: Log out from Azure
      if: steps.changed-files.outputs.has_components == 'true'
      uses: bitwarden/gh-actions/azure-logout@main

    - name: Create PR comment placeholder
      id: create-comment
      if: steps.changed-files.outputs.has_components == 'true'
      uses: bitwarden/gh-actions/update-pr-comment@main
      with:
        token: ${{ inputs.github_token }}
        pr_number: ${{ inputs.pr_number }}
        repository: ${{ inputs.repository }}
        marker_id: bitwarden-ai-validation
        body: |
          **Claude Code** is reviewing the changed Claude configuration...

          If this comment does not update with results, check the [Actions log](${{ github.server_url }}/${{ inputs.repository }}/actions/runs/${{ github.run_id }}).

    - name: Review Claude configuration and plugins
      id: components
      if: steps.changed-files.outputs.has_components == 'true'
      continue-on-error: true
      uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
      with:
        anthropic_api_key: ${{ steps.get-kv-secrets.outputs.ANTHROPIC-CODE-REVIEW-API-KEY }}
        plugin_marketplaces: |
          https://github.com/anthropics/claude-code.git
          https://github.com/bitwarden/ai-plugins.git
        plugins: |
          plugin-dev@claude-code-plugins
          claude-config-validator@bitwarden-marketplace
        # Bash is unscoped because the plugin-validator agent shells out to an
        # open-ended set of upstream-owned commands. The write-permission gate in
        # _validate-ai.yml limits this to trusted actors.
        #
        # max-turns is a backstop against a loop, not a time bound: one Task turn is
        # a whole subagent run. Wall clock is bounded by the job timeout.
        claude_args: |
          --verbose
          --model opus
          --max-turns 80
          --allowedTools "Task,Skill,Read,Write,Grep,Glob,Bash"
        prompt: |
          REPO: ${{ inputs.repository }}
          PR NUMBER: ${{ inputs.pr_number }}
          STICKY COMMENT ID: ${{ steps.create-comment.outputs.comment_id }}

          You are reviewing the Claude Code material that changed in this pull
          request. That may be a plugin marketplace, or it may just be a repo's
          own `.claude/` directory (skills, agents, commands, hooks, settings)
          and `CLAUDE.md`. Not every section below applies to every repo — use
          the skip guidance in each. You have access to two plugins, plugin-dev
          and claude-config-validator; use their agents and skills as directed.

          # RULES

          1. The repository is checked out at the PR head, but the Claude
             configuration in the working tree is NOT. See rule 2 before reading
             any of it.
          2. Read Claude configuration from `.claude-pr/`, not from the working
             tree. Before this review begins, claude-code-action replaces these
             repository-root paths with their base-branch versions, because
             PR-authored config executes at CLI startup and so cannot be trusted:
             `.claude/`, `CLAUDE.md`, `CLAUDE.local.md`, `.mcp.json`,
             `.claude.json`, `.gitmodules`, `.ripgreprc`, and `.husky`. It first
             snapshots the PR-authored versions to `.claude-pr/`, preserving the
             original layout, specifically so a review agent can inspect them
             safely. Only those root paths are affected; a nested path such as
             `plugins/foo/.claude/` is left alone.

             Map each changed path at one of those locations by prefixing it:
             the PR's `.claude/CLAUDE.md` is at `.claude-pr/.claude/CLAUDE.md`,
             and its root `CLAUDE.md` is at `.claude-pr/CLAUDE.md`. Quote line
             numbers and text from the `.claude-pr/` copy, and report the path in
             its original repo-relative form.

             The working-tree copy of those paths is base-branch content. Never
             quote it as this PR's work; doing so produces findings about code the
             contributor did not write. A path present in the working tree with no
             `.claude-pr/` counterpart was deleted by this PR.

             Everything else is untouched and should be read from the working
             tree as normal, including `plugins/`, `.claude-plugin/`, and
             `scripts/`.

             If a config file is listed as changed below and `.claude-pr/` does
             not exist at all, stop treating the working tree as the PR's content
             and say so in your report. That means this rule no longer matches
             the action's behavior.
          3. You can read files directly to inspect the changed Claude files.
          4. Writing the report is mandatory and is the only way your results
             reach the pull request. When your review is complete, your final
             action must be to write the full report in markdown to
             /tmp/validation-summary.md. Do not post PR comments yourself.

             Write that file exactly once, as the last thing you do. Never write
             an interim, partial, or "in progress" version of it. This session is
             non-interactive: when your turn ends the process exits, so whatever
             is in that file at that moment is what lands on the pull request,
             permanently, with no chance to revise it.
          5. Run every subagent synchronously — pass run_in_background: false
             where that parameter exists. Subagents default to running in the
             background, on the assumption that a notification will wake you when
             one finishes. Nothing wakes you up here. If you end your turn while a
             subagent is still running, it is killed and its findings are lost. Do
             not end your turn while any subagent is outstanding, and do not report
             on work a subagent has not yet returned.

             Synchronous does not mean one at a time. This review is on a wall
             clock, so dispatch independent subagents together in a single message
             with several tool calls: they then run concurrently and all return
             before your turn ends, which is both faster and safe.

             Every subagent call in sections 1 and 2 below is independent of every
             other one, and there can be more than two of them: section 1 is one
             validation per changed plugin and section 2 is one review per changed
             skill. Work out the full set first and send all of it in one message,
             rather than batching by section or dispatching one at a time.

          Changed files:
          ${{ steps.changed-files.outputs.changed_files }}

          Changed plugins:
          ${{ steps.changed-files.outputs.changed_plugins }}

          Agent files changed:
          ${{ steps.changed-files.outputs.agent_files }}

          Skill files changed:
          ${{ steps.changed-files.outputs.skill_files }}

          Command files changed:
          ${{ steps.changed-files.outputs.command_files }}

          Hook files changed:
          ${{ steps.changed-files.outputs.hook_files }}

          Config files changed (CLAUDE.md, .claude/):
          ${{ steps.changed-files.outputs.config_files }}

          Perform the following validations. Sections 1 and 2 are subagent work and
          every call in them is independent, so send them all out in one message per
          rule 5 rather than waiting for one to finish before dispatching the next.
          Section 3 is yours to carry out once their results come back. The numbering
          is for reference and for the order of the report, not an order of
          execution.

          ## 1. Plugin Validation (plugin-validator agent from plugin-dev)

          For each changed plugin listed above, validate the plugin structure.
          This triggers the plugin-validator agent which performs comprehensive checks:
          - plugin.json manifest correctness (name, version, required fields)
          - Directory structure and auto-discovery compliance
          - Command frontmatter (description, argument-hint, allowed-tools)
          - Agent frontmatter (name 3-50 chars lowercase hyphens, description with <example> blocks, valid model/color, system prompt >20 chars)
          - Hooks JSON schema, event names, and ${CLAUDE_PLUGIN_ROOT} usage in script paths
          - MCP server configurations (valid types, HTTPS/WSS enforcement)
          - File organization (README.md presence, no unnecessary files)
          - No hardcoded credentials in any plugin files

          Run this for every changed plugin directory even if only some component types changed.
          Skip this step if no plugin directories changed (component-only or config-only repos).

          ## 2. Skill Review (skill-reviewer agent from plugin-dev)

          If any SKILL.md files were changed (listed above), review each modified skill.
          This triggers the skill-reviewer agent which evaluates:
          - SKILL.md YAML frontmatter (required: name, description)
          - Description quality: specific trigger phrases, third-person form, appropriate length
          - Content quality: word count (target 1,000-3,000 words), imperative/infinitive writing style
          - Progressive disclosure: core SKILL.md is lean, details in references/, examples in examples/, scripts in scripts/
          - All referenced files actually exist
          - Anti-patterns: vague triggers, bloated SKILL.md, missing examples

          Skip this step if no SKILL.md files were changed.

          ## 3. Configuration & Security Review (claude-config-validator plugin)

          This is the primary review for a repo's own `.claude/` directory and
          `CLAUDE.md`, and it also applies to plugin repos. For every changed
          Claude file listed above (CLAUDE.md, and anything under `.claude/`:
          skills, agents, commands, hooks, and settings), use the
          reviewing-claude-config skill from the claude-config-validator plugin to
          review structure and security. These are exactly the paths rule 2
          covers, so read them from `.claude-pr/`:
          - Scan for committed secrets (API keys, tokens, passwords)
          - Check for hardcoded credentials in code
          - Validate permission scoping in settings files
          - Detect dangerous command auto-approvals
          - Identify overly broad file access permissions
          - Flag malformed or non-compliant agent, command, and hook definitions

          ## Output Requirements

          Write your final report to /tmp/validation-summary.md as a single
          structured markdown document:
          - Categorize issues by severity: critical, major, minor
          - Include the exact file path and line for each issue
          - Provide specific remediation guidance for each violation
          - Distinguish errors (must fix) from warnings (should fix)
          - If all checks pass, confirm with a summary of what was validated

          The report must be written to /tmp/validation-summary.md even when all
          checks pass, and even when every section above was skipped as not
          applicable. The sticky PR comment is replaced with its contents.

          End the report with this line, exactly, on a line of its own:

          <!-- validation-complete -->

          That marker is how this action tells a finished report from an
          abandoned one, so it must be the last line and it must only appear on
          a report you consider complete. A report without it is discarded and
          the check fails.

          # FINAL STEP (REQUIRED)

          Your task is not done until /tmp/validation-summary.md exists on disk
          with the completion marker as its last line. After the validations
          above, your final action must be a single Write call that creates that
          file with the full report. If a section did not apply or a check could
          not run, still write the file and say so — a report that documents a
          skipped check is complete; one that omits it is not. If you have not
          written this file, you have not completed the task, no matter what you
          reported in your responses.

    - name: Ensure a validation summary exists
      id: ensure-summary
      if: always() && steps.changed-files.outputs.has_components == 'true' && steps.create-comment.outputs.comment_id != ''
      shell: bash
      env:
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ inputs.repository }}
        RUN_ID: ${{ github.run_id }}
        COMPONENTS_OUTCOME: ${{ steps.components.outcome }}
      run: |
        # The trailing marker decides completeness, not the file existing: a review
        # that ends mid-flight can leave a partial report behind. Anything unmarked is
        # replaced with a fallback and fails the check.
        if [[ -s /tmp/validation-summary.md ]] && grep -qF '<!-- validation-complete -->' /tmp/validation-summary.md; then
          exit 0
        fi

        echo "summary_missing=true" >> "$GITHUB_OUTPUT"
        if [[ -s /tmp/validation-summary.md ]]; then
          # A later step posts whatever is at this path, so move the partial aside.
          mv /tmp/validation-summary.md /tmp/validation-summary.partial.md
          echo "::warning::The AI review wrote an incomplete validation summary (no completion marker); discarding it."
          echo "Discarded partial summary:"
          cat /tmp/validation-summary.partial.md
        else
          echo "::warning::The AI review ended without writing /tmp/validation-summary.md."
        fi

        {
          echo "### Claude Code validation did not complete"
          echo ""
          echo "The AI review did not produce a complete report, so this check has no validation feedback to show. Re-running the job starts a fresh review."
          echo ""
          echo "Review step outcome: \`${COMPONENTS_OUTCOME:-unknown}\`. A step can report success and still end without a finished report, so that outcome does not mean the review ran."
          if [[ -s /tmp/validation-summary.partial.md ]]; then
            echo ""
            echo "A partial report was written and discarded; the Actions log quotes it in full."
          fi
          echo ""
          echo "See the [Actions log](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}) for details."
        } > /tmp/validation-summary.md

    - name: Update PR comment with validation summary
      if: always() && steps.changed-files.outputs.has_components == 'true' && steps.create-comment.outputs.comment_id != ''
      uses: bitwarden/gh-actions/update-pr-comment@main
      with:
        token: ${{ inputs.github_token }}
        pr_number: ${{ inputs.pr_number }}
        repository: ${{ inputs.repository }}
        marker_id: bitwarden-ai-validation
        comment_id: ${{ steps.create-comment.outputs.comment_id }}
        body_file: /tmp/validation-summary.md

    - name: Summary
      if: always()
      shell: bash
      env:
        SHOULD_RUN: ${{ steps.changed-files.outputs.should_run }}
        STRUCTURE_RESULT: ${{ steps.structure.outcome }}
        MARKETPLACE_RESULT: ${{ steps.marketplace.outcome }}
        VERSION_BUMP_RESULT: ${{ steps.version-bump.outcome }}
        COMPONENTS_RESULT: ${{ steps.components.outcome }}
        SUMMARY_MISSING: ${{ steps.ensure-summary.outputs.summary_missing }}
        HAS_COMPONENTS: ${{ steps.changed-files.outputs.has_components }}
        CHANGED_PLUGINS: ${{ steps.changed-files.outputs.changed_plugins }}
      run: |
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📊 Validation Summary"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""

        if [[ "$SHOULD_RUN" != "true" ]]; then
          echo "✅ No Claude-related files changed — validation not required."
          exit 0
        fi

        # An empty outcome means the step was gated out (script absent or nothing to validate).
        echo "Plugin structure validation: ${STRUCTURE_RESULT:-skipped}"
        echo "Marketplace validation: ${MARKETPLACE_RESULT:-skipped}"
        echo "Version bump validation: ${VERSION_BUMP_RESULT:-skipped}"
        # The step can exit 0 without producing a report, so report both.
        if [[ "$SUMMARY_MISSING" == "true" ]]; then
          echo "Component & security validation (AI-driven): ${COMPONENTS_RESULT:-skipped}, but produced no complete report"
        else
          echo "Component & security validation (AI-driven): ${COMPONENTS_RESULT:-skipped}"
        fi
        echo ""

        if [[ -f /tmp/structure-validation.log ]] && [[ "$STRUCTURE_RESULT" == "failure" ]]; then
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 Plugin Structure Validation Details:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cat /tmp/structure-validation.log
          echo ""
        fi

        if [[ -f /tmp/marketplace-validation.log ]] && [[ "$MARKETPLACE_RESULT" == "failure" ]]; then
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 Marketplace Validation Details:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cat /tmp/marketplace-validation.log
          echo ""
        fi

        if [[ -f /tmp/version-bump-validation.log ]] && [[ "$VERSION_BUMP_RESULT" == "failure" ]]; then
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 Version Bump Validation Details:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cat /tmp/version-bump-validation.log
          echo ""
        fi

        if [[ "$COMPONENTS_RESULT" == "failure" ]]; then
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 Component & Security Validation Details:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "See the sticky PR comment for detailed validation feedback from:"
          echo "  - plugin-dev (component validation)"
          echo "  - claude-config-validator (security validation)"
          echo ""
        fi

        # A missing or unfinished report must not pass green.
        if [[ "$SUMMARY_MISSING" == "true" ]]; then
          echo "AI-driven review produced no complete summary; a fallback was posted to the PR comment. Re-run the job to start a fresh review."
          echo ""
        fi

        FAILED=false
        for RESULT in "$STRUCTURE_RESULT" "$MARKETPLACE_RESULT" "$VERSION_BUMP_RESULT" "$COMPONENTS_RESULT"; do
          if [[ "$RESULT" == "failure" ]]; then
            FAILED=true
          fi
        done
        if [[ "$SUMMARY_MISSING" == "true" ]]; then
          FAILED=true
        fi

        if [[ "$FAILED" == "true" ]]; then
          echo "❌ Validation failed. Please review the errors above."
          echo ""
          echo "For more information on plugin requirements:"
          echo "  🔗 https://docs.claude.com/en/docs/claude-code/plugins-reference"
          exit 1
        else
          echo "✅ All validation checks passed!"
          echo ""
          echo "For more information on plugin requirements:"
          echo "  🔗 https://docs.claude.com/en/docs/claude-code/plugins-reference"
        fi
