name: "Cargo Build Cache Save"
description: "Save the Cargo target directory restored by cargo-build-cache/restore, after a successful build."
author: "Bitwarden"
branding:
  icon: archive
  color: blue

runs:
  using: "composite"
  steps:
    - name: Load build cache state
      id: state
      shell: bash
      env:
        _STATE_DIR: ${{ runner.temp }}/cargo-build-cache
      run: |
        if [ ! -f "$_STATE_DIR/primary_key" ]; then
          echo "::error::No build cache state found. Run cargo-build-cache/restore earlier in this job."
          exit 1
        fi
        delimiter="EOF_$(git hash-object --stdin <<< "$RANDOM$RANDOM$(cat "$_STATE_DIR/primary_key")")"
        {
          echo "primary_key=$(cat "$_STATE_DIR/primary_key")"
          echo "working_directory=$(cat "$_STATE_DIR/working_directory")"
          echo "cache_hit=$(cat "$_STATE_DIR/cache_hit")"
          echo "paths<<${delimiter}"
          cat "$_STATE_DIR/paths"
          echo ""
          echo "${delimiter}"
        } >> "$GITHUB_OUTPUT"
        if [ "$(cat "$_STATE_DIR/cache_hit")" = "true" ]; then
          echo "The build output was restored from an exact key match, nothing to save."
        fi

    # Steps check the outcome of the previous step explicitly, so they behave the same whether or
    # not an earlier step of the job failed.
    - name: Record build inputs
      id: record
      if: always() && steps.state.outcome == 'success' && steps.state.outputs.cache_hit != 'true'
      shell: bash
      working-directory: ${{ steps.state.outputs.working_directory }}
      env:
        _STATE_DIR: ${{ runner.temp }}/cargo-build-cache
      run: |
        state_dir="$_STATE_DIR"
        if command -v cygpath > /dev/null; then
          state_dir=$(cygpath -u "$state_dir")
        fi
        bash "${{ github.action_path }}/../build-cache.sh" record "$state_dir/pending_inputs"

    - name: Save build output
      id: save
      if: always() && steps.record.outcome == 'success'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.state.outputs.paths }}
        key: ${{ steps.state.outputs.primary_key }}
