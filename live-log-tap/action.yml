name: "Live Log Tap"
description: "Stream the job's masked log output to a URL, command, and/or file while the job runs"

inputs:
  url:
    description: "HTTP(S) endpoint to POST masked log lines to, in batches, as text/plain"
    required: false
  headers:
    description: "Extra request headers for `url`, one `Name: value` per line (e.g. Authorization)"
    required: false
  batch-interval:
    description: "Seconds between batches sent to `url`"
    required: false
    default: "1"
  command:
    description: "Shell command that receives masked log lines on stdin for the rest of the job"
    required: false
  file:
    description: "Path to append masked log lines to"
    required: false
  drain-timeout:
    description: "Seconds the post step waits for the last lines to be forwarded"
    required: false
    default: "30"

runs:
  using: "node24"
  main: "main.js"
  post: "post.js"

branding:
  icon: radio
  color: blue
