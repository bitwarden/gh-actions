name: Validate AI

on:
  workflow_call:
    secrets:
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_CLIENT_ID:
        required: true

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-permission:
    name: Check permission
    uses: bitwarden/gh-actions/.github/workflows/_check-permission.yml@main
    with:
      failure_mode: "skip"
      require_permission: "write"
    permissions:
      contents: read

  validate:
    name: Validate
    runs-on: ubuntu-24.04
    needs: check-permission
    if: needs.check-permission.outputs.should_proceed == 'true'
    # A review that actually waits for its subagents takes far longer than the
    # abandoned reviews this budget was originally sized against: run 31699838478
    # in bitwarden/ai-plugins spent over 14 minutes on the same input that earlier
    # runs "finished" in four, and was killed here at 15. The step cannot carry a
    # timeout of its own, and the model's turn cap does not bound wall clock, so
    # this is the only limit that does. Set generously until a run completes and
    # gives a real duration to tune against.
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Run plugin validation
        uses: bitwarden/gh-actions/validate-ai@main
        with:
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          pr_number: ${{ github.event.pull_request.number }}
          repository: ${{ github.repository }}
          checkout_ref: ${{ github.event.pull_request.head.sha }}
          base_ref: ${{ github.base_ref }}
          github_token: ${{ github.token }}
