name: Test Download Artifacts Action

on:
  workflow_dispatch:
    inputs: {}
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Upload Test Artifacts
    types:
      - completed
  pull_request:
    paths:
      - "download-artifacts/**"
      - ".github/workflows/test-download-artifacts.yml"

permissions:
  contents: read

jobs:
  download-latest:
    name: Download Latest
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: artifact
          path: artifact

      - name: Test
        run: |
          cat artifact/sha
          echo "$GITHUB_SHA"

  download-main:
    name: Download main
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: artifact
          path: artifact
          branch: main

      - name: Test
        run: |
          cat artifact/sha
          echo "$GITHUB_SHA"

  download-branch:
    name: Download current branch
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Extract branch name
        id: extract_branch
        run: |
          branch=${GITHUB_REF#refs/heads/}
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: artifact
          path: artifact
          branch: ${{ steps.extract_branch.outputs.branch }}

      - name: Test
        run: |
          cat artifact/sha
          echo "$GITHUB_SHA"

  download-pr:
    name: Download Pull Request
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: artifact
          path: artifact
          pr: ${{github.event.pull_request.number}}

      - name: Test
        run: |
          cat artifact/sha
          echo "$GITHUB_SHA"

  download-all:
    name: Download All
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml

      - name: Test
        run: |
          ls -atlh
          cat sha
          cat sha1
          cat sha2

  download-multiple:
    name: Download Multiple
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: "artifact1,
            artifact2"

      - name: Test
        run: |
          ls -atlh
          cat sha1
          cat sha2

  download-wildcard:
    name: Download Wildcard
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: "*.txt"

      - name: Test
        run: |
          ls -atlh
          cat sha1
          cat sha2

  download-conclusion:
    name: Download Conclusion
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: artifact
          path: artifact
          workflow_conclusion: ""

      - name: Test
        run: |
          cat artifact/sha
          echo "$GITHUB_SHA"

  download-outputs:
    name: Download outputs should not be empty
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Download
        id: download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml

      - name: Test artifact-build-commit
        env:
          _ARTIFACT_BUILD_COMMIT: ${{ steps.download.outputs.artifact-build-commit }}
        run: |
          ls -atlh
          echo "$_ARTIFACT_BUILD_COMMIT"
          if [[ -z "$_ARTIFACT_BUILD_COMMIT" ]]; then
              echo "artifact-build-commit is empty"
              exit 1
          fi

      - name: Test artifact-build-branch
        env:
          _ARTIFACT_BUILD_BRANCH: ${{ steps.download.outputs.artifact-build-branch }}
        run: |
          ls -atlh
          echo "$_ARTIFACT_BUILD_BRANCH"
          if [[ -z "$_ARTIFACT_BUILD_BRANCH" ]]; then
              echo "artifact-build-branch is empty"
              exit 1
          fi

  download-no-matching-artifacts:
    name: Download with no matching artifacts should not crash
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: List (dry run)
        id: dry-run
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: does-not-exist
          dry_run: true

      - name: Download
        id: download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: does-not-exist
          if_no_artifact_found: warn

      - name: Test
        env:
          _DRY_RUN_FOUND: ${{ steps.dry-run.outputs.found_artifact }}
          _DOWNLOAD_FOUND: ${{ steps.download.outputs.found_artifact }}
        run: |
          if [[ "$_DRY_RUN_FOUND" != "false" || "$_DOWNLOAD_FOUND" != "false" ]]; then
            echo "Expected found_artifact=false for both steps (dry run: '$_DRY_RUN_FOUND', download: '$_DOWNLOAD_FOUND')"
            exit 1
          fi

  download-branch-head:
    name: Download main with require_branch_head
    runs-on: ubuntu-22.04
    # The triggering upload run is the build of main HEAD, so the guard should pass.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Download
        id: download
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: artifact
          path: artifact
          branch: main
          require_branch_head: true

      - name: Test
        env:
          _ARTIFACT_BUILD_COMMIT: ${{ steps.download.outputs.artifact-build-commit }}
          _TRIGGERING_COMMIT: ${{ github.event.workflow_run.head_sha }}
          _RUN_ID: ${{ steps.download.outputs.run_id }}
          _TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [[ "$_ARTIFACT_BUILD_COMMIT" != "$_TRIGGERING_COMMIT" ]]; then
            echo "Expected the build of $_TRIGGERING_COMMIT, got $_ARTIFACT_BUILD_COMMIT"
            exit 1
          fi
          if [[ "$_RUN_ID" != "$_TRIGGERING_RUN_ID" ]]; then
            echo "Expected run_id $_TRIGGERING_RUN_ID, got $_RUN_ID"
            exit 1
          fi

  require-branch-head-without-branch:
    name: Download with require_branch_head but no branch should fail
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Download
        id: download
        continue-on-error: true
        uses: ./download-artifacts
        with:
          workflow: upload-test-artifacts.yml
          artifacts: artifact
          require_branch_head: true

      - name: Test
        env:
          _OUTCOME: ${{ steps.download.outcome }}
        run: |
          if [[ "$_OUTCOME" != "failure" ]]; then
            echo "Expected the step to fail, got $_OUTCOME"
            exit 1
          fi
